version: '3.8'

services:
  recommender-app:
    build: .
    environment:
      - MODEL_PATH=/app/assets/all_mini_lm
      - FAISS_PATH=/app/assets/my_index_quantized.faiss
      - METADATA_PATH=/app/assets/articles_meta.json
      - TOKENIZED_CORPUS_PATH=/app/assets/tokenized_corpus.json
    volumes:
      - ./assets:/app/assets
    # Deploy multiples of these to match structural workloads
    deploy:
      replicas: 3

  loadbalancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - recommender-app