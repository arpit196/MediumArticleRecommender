name: API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install serving and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run unit and synthetic integration tests
        run: >-
          python -m pytest
          --junitxml=test-results/junit.xml
          --cov=recommender_api_under_test
          --cov-report=term-missing
          --cov-report=xml:test-results/coverage.xml
          --cov-fail-under=85
      - name: Save dependency versions
        if: always()
        run: |
          mkdir -p test-results
          python -m pip freeze > test-results/dependencies.txt
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: test-results/
          retention-days: 7
